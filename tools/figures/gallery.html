<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>図の一覧（確認用）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!-- ★2026-10-03追加：js/figure-map.js の 図を まとめて 見る 確認用ページ（アプリからは 使わない）。
     ?from=321 で 321番目から、?q=内陸 で 問題文に「内陸」を ふくむ ものだけ。 -->
<style>
  body { margin: 0; padding: 12px; background: #f3ebf7; font-family: 'Zen Maru Gothic', sans-serif; color: #4a3b52; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .card { background: #fff; border-radius: 12px; padding: 8px; }
  .q { font-size: 11px; font-weight: 700; margin-bottom: 4px; }
  .tag { font-size: 10px; color: #db2777; font-weight: 900; }
  svg { width: 100%; height: auto; display: block; }
  .fig-row { display: flex; gap: 6px; } .fig-cell { flex: 1; } .fig-cap { font-size: 11px; text-align: center; font-weight: 900; }
</style>
</head>
<body>
<div id="info"></div>
<div class="grid" id="grid"></div>
<script src="../../js/figures.js"></script>
<script src="../../js/figures-science.js"></script>
<script src="../../js/figures-social.js"></script>
<script src="../../js/figures-japan.js"></script>
<script src="../../js/figures-kokugo.js"></script>
<script src="../../js/sky-calc.js"></script>
<script src="../../js/figures-extra.js"></script>
<script src="../../js/figure-map.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search), from = Number(qs.get("from")) || 0, q = qs.get("q") || "";
  var keys = Object.keys(window.FIGURE_MAP), html = "", n = 0;
  keys.forEach(function (k, i) {
    if (i < from || (q && k.indexOf(q) < 0)) return;
    var e = window.FIGURE_MAP[k]; n++;
    html += '<div class="card"><div class="q">#' + i + ' ' + k.replace(/</g, "&lt;").slice(0, 80) + '</div>' +
      (e.fig ? '<div class="tag">問題の図</div>' + window.renderFigure(e.fig) : "") +
      (e.explain_fig ? '<div class="tag">解説の図</div>' + window.renderFigure(e.explain_fig) : "") + '</div>';
  });
  document.getElementById("grid").innerHTML = html;
  document.getElementById("info").textContent = n + " / " + keys.length + " 問";
})();
</script>
</body>
</html>
