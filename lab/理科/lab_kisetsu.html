<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>季節と生き物ラボ 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!-- ★2026-10-16追加：4年「季節と生き物」（春・夏・秋・冬・1年間）。生き物の ようすの カードを 見て、どの 季節かを えらぶ。
     正解すると その 生き物の 春夏秋冬 4まいを ならべて 見せ、気温の 変化と つなげる。 -->
<style>
  :root { --ink: #4a3b52; --sub: #7a6985; --pink: #db2777; --line: #e9d5ff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Zen Maru Gothic', sans-serif; color: var(--ink); background: #f3ebf7; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 12px 12px 28px; }
  h1 { font-size: 19px; margin: 4px 0 2px; } .lead { font-size: 12.5px; font-weight: 700; color: var(--sub); margin-bottom: 10px; line-height: 1.6; }
  .card { background: #fff; border-radius: 16px; padding: 12px 13px; margin: 8px 0; font-size: 13.5px; font-weight: 700; line-height: 1.7; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 900; }
  .q { text-align: center; margin: 8px 0; }
  .q .em { font-size: 46px; line-height: 1.1; } .q .who { font-size: 15px; color: var(--sub); }
  .q .txt { font-size: 18px; font-weight: 900; margin-top: 4px; }
  .ch { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
  .ch button { font: inherit; font-weight: 900; font-size: 18px; padding: 10px 4px; border-radius: 14px; border: 3px solid var(--line); background: #faf5ff; color: #6b21a8; cursor: pointer; }
  .ch button.ng { background: #fee2e2; border-color: #f87171; color: #991b1b; }
  .ch button.ok { background: #dcfce7; border-color: #22c55e; color: #166534; }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .strip div { border: 2px solid var(--line); border-radius: 12px; padding: 6px 5px; font-size: 11.5px; line-height: 1.45; min-height: 96px; }
  .strip div b { display: block; font-size: 13px; }
  .strip div.on { border-color: var(--pink); background: #fdf2f8; }
  .strip .t { color: var(--sub); font-size: 10.5px; display: block; margin-top: 3px; }
  #msg { text-align: center; min-height: 2.4em; font-size: 14px; }
  #msg b { color: var(--pink); }
  button.next { font: inherit; font-weight: 900; border: none; border-radius: 14px; padding: 11px 18px; color: #fff; background: linear-gradient(135deg, #ec4899, #a855f7); cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌸 季節と生き物ラボ</h1>
  <div class="lead">生き物の ようすの カードを 見て、どの 季節か えらぼう。正解すると、その 生き物の 1年の 変わり方が 見られるよ。気温と いっしょに 考えて みよう。</div>
  <div class="card">
    <div class="bar"><span id="count"></span><span id="score"></span></div>
    <div class="q" id="q" aria-live="polite"></div>
    <div class="ch" id="ch"></div>
    <div id="msg"></div>
    <div id="strip"></div>
    <div style="text-align:center;margin-top:8px"><button class="next" id="next" hidden>つぎの カードへ ▶</button></div>
  </div>
  <div class="card">💡 <b>季節と 生き物の 関係</b><br>春に 気温が 上がると 生き物の 活動が さかんに なり、夏に いちばん 活発に なる。秋に 気温が 下がると 動きが にぶく なり、冬は たね・たまご・冬芽・冬眠 などで 寒さを こす。</div>
</div>
<script>
(function () {
  "use strict";
  var S = ["春", "夏", "秋", "冬"], TEMP = ["気温が だんだん 上がる", "気温が いちばん 高い", "気温が だんだん 下がる", "気温が いちばん 低い"];
  var THINGS = [
    { n: "サクラ", e: "🌸", s: ["花が さき、葉が 出はじめる", "葉が たくさん しげる", "葉の 色が 変わり、落ちはじめる", "葉が 落ち、えだに 芽（冬芽）が ある"] },
    { n: "ツバメ", e: "🐦", s: ["南の 国から やって きて、巣を 作る", "ひなを 育て、ひなが 巣立つ", "南の あたたかい 国へ わたって いく", "日本では ほとんど 見られない"] },
    { n: "ヘチマ", e: "🌱", s: ["たねを まくと、芽が 出る", "くきが よく のび、黄色い 花が さく", "実が 茶色く なり、中に たねが できる", "かれて、たねで 冬を こす"] },
    { n: "カエル", e: "🐸", s: ["冬眠から さめて、たまごを 産む", "活発に 動き回り、虫を 食べる", "だんだん 動きが にぶく なる", "土の 中で じっと して 冬を こす"] },
    { n: "オオカマキリ", e: "🦗", s: ["たまごから よう虫が 出て くる", "よう虫が 大きく 育つ", "成虫が たまご（あわの ような かたまり）を 産む", "たまごの すがたで 冬を こす"] }
  ];
  var deck = [], qi = 0, N = 8, clean = 0, cur = null, miss = false;
  var $ = function (id) { return document.getElementById(id); };
  function shuffle(a) { return a.map(function (x) { return [Math.random(), x]; }).sort(function (p, q) { return p[0] - q[0]; }).map(function (p) { return p[1]; }); }
  function newDeck() { var all = []; THINGS.forEach(function (t, ti) { t.s.forEach(function (_, si) { all.push({ ti: ti, si: si }); }); }); deck = shuffle(all).slice(0, N); qi = 0; clean = 0; }
  function start() {
    cur = deck[qi]; miss = false; var t = THINGS[cur.ti];
    $("count").textContent = (qi + 1) + " / " + N; $("score").textContent = "1回で 正解：" + clean;
    $("q").innerHTML = '<div class="em">' + t.e + '</div><div class="who">' + t.n + '</div><div class="txt">「' + t.s[cur.si] + '」</div>';
    $("ch").innerHTML = S.map(function (s, i) { return '<button type="button" data-i="' + i + '">' + s + "</button>"; }).join("");
    $("msg").innerHTML = "どの 季節の ようすかな？"; $("strip").innerHTML = ""; $("next").hidden = true;
  }
  $("ch").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-i]"); if (!b || !$("next").hidden) return;
    var i = Number(b.getAttribute("data-i")), t = THINGS[cur.ti];
    if (i !== cur.si) { b.classList.add("ng"); miss = true; $("msg").innerHTML = "🔁 " + S[i] + "の " + t.n + "は「" + t.s[i] + "」。もう一度 考えて みよう。"; return; }
    b.classList.add("ok"); if (!miss) clean++;
    $("score").textContent = "1回で 正解：" + clean;
    $("msg").innerHTML = "⭕ <b>" + S[cur.si] + "</b>！（" + TEMP[cur.si] + "）" + (miss ? "" : " ✨");
    $("strip").innerHTML = '<div class="strip">' + S.map(function (s, k) { return '<div class="' + (k === cur.si ? "on" : "") + '"><b>' + s + "</b>" + t.s[k] + '<span class="t">' + TEMP[k] + "</span></div>"; }).join("") + "</div>";
    $("next").hidden = false; $("next").textContent = qi + 1 < N ? "つぎの カードへ ▶" : "もう一度 あそぶ 🔁";
  });
  $("next").addEventListener("click", function () { if (qi + 1 < N) qi++; else newDeck(); start(); });
  newDeck(); start();
})();
</script>
</body>
</html>
